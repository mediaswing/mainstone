[package]
name = "mainstone"
version = "1.6.0"
edition = "2024"
description = "Mainstone Cloud System: users, groups and devices in Microsoft Entra ID and Intune, with CSV import and export and a copy to MariaDB"
license = "MIT"
authors = ["Will Richards <mediaswing@outlook.com>"]
repository = "https://github.com/mediaswing/mainstone"
default-run = "mainstone"

[[bin]]
name = "mainstone"
path = "src/main.rs"

# Builds the .app, .deb or .zip for the platform it runs on; see
# src/package/main.rs. Standard library only.
[[bin]]
name = "mainstone-package"
path = "src/package/main.rs"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
chrono = "0.4"
csv = "1.4"
rand = "0.9"
base64 = "0.22"
# PKCE for the one-off admin sign-in, and checking downloaded updates against
# the digests GitHub publishes for release files.
sha2 = "0.10"
# Native open/save dialogs. The default `xdg-portal` backend on Linux talks to
# the desktop portal over D-Bus in pure Rust, so there is no GTK to link.
rfd = "0.17"
# rustls everywhere, as in watchspend: no system OpenSSL for the Linux build to
# be tied to, and the same TLS behaviour on all three platforms. `json` is for
# Microsoft Graph, which speaks nothing else.
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }
# `ring` matches what ureq picks, since rustls chooses one crypto provider for
# the whole process and two crates disagreeing is a panic on first connect.
mysql = { version = "28", default-features = false, features = ["minimal", "buffer-pool", "rustls-tls-ring"] }
# SSH for the Servers tab. Pure Rust, like the rest: `ring` again rather
# than russh's default aws-lc-rs, for the same one-provider reason as above.
# russh is async, so each snapshot runs a small single-threaded tokio runtime
# on its own background thread.
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
# The success and failure sounds, as in speechout. Needs ALSA's headers on
# Linux (libasound2-dev).
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "wav", "symphonia-mp3", "symphonia-wav"] }

[profile.release]
opt-level = 2
strip = true
